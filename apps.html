<style>

<body class="flex flex-col min-h-screen">
<!-- Top Status Bar (Based on TopAppBar Shared Component) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin py-sm bg-background border-b border-on-tertiary-fixed-variant">
<span class="font-label-sm text-label-sm text-primary">12:45 • MON OCT 23 • 85%</span>
<div class="flex gap-gutter">
<button class="font-label-sm text-label-sm text-primary hover:bg-on-primary hover:text-background transition-none">MENU</button>
<button class="font-label-sm text-label-sm text-primary hover:bg-on-primary hover:text-background transition-none">LOG</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-xl pb-xl px-margin custom-scrollbar overflow-y-auto">
<!-- App List Section -->
<section class="mt-lg">
<div class="flex flex-col">
<a class="app-item group py-md border-b border-on-tertiary-fixed-variant flex justify-between items-center transition-none" href="#">
<span class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg">Phone</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-none" style="font-variation-settings: 'wght' 100;">arrow_forward</span>
</a>
<a class="app-item group py-md border-b border-on-tertiary-fixed-variant flex justify-between items-center transition-none" href="#">
<span class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg">Messages</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-none" style="font-variation-settings: 'wght' 100;">arrow_forward</span>
</a>
<a class="app-item group py-md border-b border-on-tertiary-fixed-variant flex justify-between items-center transition-none" href="#">
<span class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg">Alarm</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-none" style="font-variation-settings: 'wght' 100;">arrow_forward</span>
</a>
<a class="app-item group py-md border-b border-on-tertiary-fixed-variant flex justify-between items-center transition-none" href="#">
<span class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg">Calculator</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-none" style="font-variation-settings: 'wght' 100;">arrow_forward</span>
</a>
<a class="app-item group py-md border-b border-on-tertiary-fixed-variant flex justify-between items-center transition-none" href="#">
<span class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg">Calendar</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-none" style="font-variation-settings: 'wght' 100;">arrow_forward</span>
</a>
<a class="app-item group py-md border-b border-on-tertiary-fixed-variant flex justify-between items-center transition-none" href="#">
<span class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg">Camera</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-none" style="font-variation-settings: 'wght' 100;">arrow_forward</span>
</a>

<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-none" style="font-variation-settings: 'wght' 100;">arrow_forward</span>
</a>

<div class="h-xl"></div>
</main>
<!-- Bottom Action Area (Task-focused Suppression of Nav) -->
<footer class="fixed bottom-0 w-full z-50 px-margin py-lg bg-background flex justify-center">
<button class="w-full border border-primary py-md font-label-sm text-label-sm text-primary hover:bg-primary hover:text-background transition-none uppercase tracking-widest" onclick="window.history.back()">
            BACK
        </button>
</footer>
<!-- Bottom Navigation (Shared Component - Conditional Visibility) -->
<!-- Hidden because this is a focused task/launcher list view -->
<nav class="hidden fixed bottom-0 w-full z-50 flex justify-between items-center px-margin py-md bg-background border-t border-on-tertiary-fixed-variant">
<div class="flex items-center gap-xs text-primary px-md py-xs">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-label-sm text-label-sm">SEARCH</span>
</div>
<div class="flex items-center gap-xs bg-primary text-background px-md py-xs">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">HOME</span>
</div>
</nav>
<script>
        // Micro-interaction: Smooth hover states and haptic simulation
        const appItems = document.querySelectorAll('.app-item');
        appItems.forEach(item => {
            item.addEventListener('touchstart', () => {
                item.style.backgroundColor = '#ffffff';
                item.style.color = '#000000';
            });
            item.addEventListener('touchend', () => {
                item.style.backgroundColor = 'transparent';
                item.style.color = '#ffffff';
            });
        });

        // Suppression Logic Check
        // Since this is the "App List" (Launcher), we follow the design instruction 
        // to show a simple "BACK" button at the bottom instead of the standard Nav Bar.
    </script>
