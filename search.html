<body class="bg-background text-primary selection:bg-primary selection:text-background">
<!-- Top Status Bar (TopAppBar) -->
<header class="flex justify-between items-center px-margin py-sm w-full font-label-sm text-label-sm border-b border-on-tertiary-fixed-variant fixed top-0 bg-background z-50">
<div class="text-primary">12:45 • MON OCT 23 • 85%</div>
<div class="flex gap-md">
<span class="hover:bg-on-primary hover:text-background transition-none cursor-pointer">MENU</span>
<span class="hover:bg-on-primary hover:text-background transition-none cursor-pointer">LOG</span>
</div>
</header>
<main class="pt-xl px-margin pb-32 max-w-screen-md mx-auto">
<!-- Search Input Section -->
<section class="mt-xl mb-xl">
<div class="relative group">
<input autocomplete="off" autofocus="" class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline focus:border-primary transition-colors py-sm font-label-sm text-label-sm placeholder:text-on-tertiary-fixed-variant focus:ring-0 outline-none" id="app-search" placeholder="TYPE TO SEARCH" type="text"/>
<div class="absolute left-[110px] top-1/2 -translate-y-1/2 pointer-events-none" id="cursor-indicator">
<span class="blinking-cursor"></span>
</div>
</div>
</section>
<!-- Result List -->
<section class="space-y-xl" id="results-container">
<!-- Group C -->
<div class="search-group">
<h2 class="font-headline-md text-headline-md text-primary mb-md">C</h2>

<span class="font-label-sm text-label-sm opacity-0 group-hover:opacity-100 transition-none">→</span>
</div>
</li>
<li class="py-md border-b border-on-tertiary-fixed-variant group cursor-pointer hover:bg-white hover:text-black transition-none">
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm">CALENDAR</span>
<span class="font-label-sm text-label-sm opacity-0 group-hover:opacity-100 transition-none">→</span>
</div>
</li>
<li class="py-md border-b border-on-tertiary-fixed-variant group cursor-pointer hover:bg-white hover:text-black transition-none">
<div class="flex justify-between items-center">

</div>
</li>
<li class="py-md border-b border-on-tertiary-fixed-variant group cursor-pointer hover:bg-white hover:text-black transition-none">
<div class="flex justify-between items-center">

</div>

<!-- Group M (Filtered example) -->
<div class="search-group">
<h2 class="font-headline-md text-headline-md text-primary mb-md">M</h2>
<ul class="space-y-0 border-t border-on-tertiary-fixed-variant">
<li class="py-md border-b border-on-tertiary-fixed-variant group cursor-pointer hover:bg-white hover:text-black transition-none">

<!-- Group S -->

<ul class="space-y-0 border-t border-on-tertiary-fixed-variant">
<li class="py-md border-b border-on-tertiary-fixed-variant group cursor-pointer hover:bg-white hover:text-black transition-none">

</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-between items-center px-margin py-md bg-background border-t border-on-tertiary-fixed-variant">
<div class="flex flex-1 justify-center">
<button class="bg-primary text-background px-md py-xs font-label-sm text-label-sm flex flex-col items-center">
<span class="material-symbols-outlined" data-icon="search">search</span>
                SEARCH
            </button>
</div>
<div class="flex flex-1 justify-center">
<button class="text-primary px-md py-xs font-label-sm text-label-sm flex flex-col items-center hover:bg-surface-variant transition-none">
<span class="material-symbols-outlined" data-icon="home">home</span>
                HOME
            </button>
</div>

<script>
        const searchInput = document.getElementById('app-search');
        const cursorIndicator = document.getElementById('cursor-indicator');
        const searchGroups = document.querySelectorAll('.search-group');

        // Dynamic cursor positioning logic
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            // Hide custom placeholder/cursor if text is present
            if (val.length > 0) {
                cursorIndicator.style.display = 'none';
            } else {
                cursorIndicator.style.display = 'block';
            }

            // Simple filtering logic
            const query = val.toUpperCase();
            searchGroups.forEach(group => {
                const items = group.querySelectorAll('li');
                let hasVisible = false;
                
                items.forEach(item => {
                    const text = item.textContent.toUpperCase();
                    if (text.includes(query)) {
                        item.style.display = 'block';
                        hasVisible = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                group.style.display = hasVisible ? 'block' : 'none';
            });
        });

        // Maintain focus
        document.addEventListener('click', () => {
            searchInput.focus();
        });
    </script>
</body></html>
