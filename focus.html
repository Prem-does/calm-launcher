<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #131313;
            color: #ffffff;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .progress-bar {
            transition: width 2s linear;
        }
        .fade-in {
            animation: fadeIn 3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background flex flex-col justify-center items-center min-h-screen p-margin">
<!-- Focus Content Area -->
<main class="flex-grow flex items-center justify-center fade-in">
<h1 class="font-body-md text-body-md text-primary tracking-widest opacity-80 italic">
            Be here now.
        </h1>
</main>
<!-- Long Press Exit UI -->
<footer class="w-full flex flex-col items-center gap-sm mb-xl">
<div class="w-24 h-[1px] bg-on-tertiary-fixed-variant mb-xs overflow-hidden opacity-0 transition-opacity duration-300" id="progress-container">
<div class="h-full bg-primary w-0" id="progress-bar"></div>
</div>
<button class="font-label-sm text-label-sm text-secondary tracking-widest uppercase hover:text-primary transition-colors cursor-pointer" id="exit-button">
            Hold to exit
        </button>
</footer>
<script>
        const exitButton = document.getElementById('exit-button');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        let timer;
        const duration = 2000; // 2 seconds long press

        function startTimer() {
            progressContainer.classList.remove('opacity-0');
            progressContainer.classList.add('opacity-100');
            progressBar.style.transition = `width ${duration}ms linear`;
            progressBar.style.width = '100%';
            
            timer = setTimeout(() => {
                // Exit logic
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    alert('Focus session ended.');
                    window.location.reload(); // Simulate exit by resetting
                }, 500);
            }, duration);
        }

        function cancelTimer() {
            clearTimeout(timer);
            progressContainer.classList.remove('opacity-100');
            progressContainer.classList.add('opacity-0');
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
        }

        // Desktop Events
        exitButton.addEventListener('mousedown', startTimer);
        exitButton.addEventListener('mouseup', cancelTimer);
        exitButton.addEventListener('mouseleave', cancelTimer);

        // Mobile Events
        exitButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startTimer();
        });
        exitButton.addEventListener('touchend', cancelTimer);
        exitButton.addEventListener('touchcancel', cancelTimer);
    </script>
</body></html>
