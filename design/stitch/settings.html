<body class="bg-background text-on-background antialiased min-h-screen flex flex-col selection:bg-primary selection:text-on-primary">
<!-- TopAppBar (Web & Mobile context, but adjusted as a "back" header for Settings) -->
<header class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-base w-full top-0 bg-background dark:bg-background border-b border-white/20">
<div class="flex items-center gap-gutter cursor-pointer group">
<span aria-label="Back" class="material-symbols-outlined text-primary dark:text-primary transition-opacity duration-200 ease-in-out group-hover:opacity-70">arrow_back</span>
<span class="font-headline-md text-headline-md tracking-tighter text-primary dark:text-primary">Settings</span>
</div>
<!-- Settings shouldn't have the status bar info in the trailing action usually, but keeping it minimal -->
</header>
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop pt-stack-lg pb-32 max-w-3xl mx-auto w-full">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-stack-lg">Configuration</h1>
<ul class="flex flex-col w-full">
<!-- Manage Apps -->
<li class="border-b border-white/20 py-stack-md flex justify-between items-center group cursor-pointer transition-opacity duration-200 ease-in-out hover:opacity-70">
<span class="font-body-lg text-body-lg text-primary">Manage Apps</span>
<span class="material-symbols-outlined text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">chevron_right</span>
</li>
<!-- Screen Time -->
<li class="border-b border-white/20 py-stack-md flex flex-col sm:flex-row sm:justify-between sm:items-center group cursor-pointer transition-opacity duration-200 ease-in-out hover:opacity-70 gap-1">
<span class="font-body-lg text-body-lg text-primary">Screen Time</span>
<span class="font-body-md text-body-md text-on-surface-variant">1h 12m today</span>
</li>
<!-- Opening Delays -->
<li class="border-b border-white/20 py-stack-md flex flex-col sm:flex-row sm:justify-between sm:items-center group cursor-pointer transition-opacity duration-200 ease-in-out hover:opacity-70 gap-1">
<span class="font-body-lg text-body-lg text-primary">Opening Delays</span>
<span class="font-body-md text-body-md text-on-surface-variant">Enabled</span>
</li>
<!-- Greyscale Mode -->
<li class="border-b border-white/20 py-stack-md flex justify-between items-center group cursor-pointer transition-opacity duration-200 ease-in-out hover:opacity-70">
<span class="font-body-lg text-body-lg text-primary">Greyscale Mode</span>
<!-- Simple Toggle Visually -->
<div class="w-10 h-5 border border-primary rounded-full relative">
<div class="absolute left-1 top-1/2 -translate-y-1/2 w-3 h-3 bg-primary rounded-full"></div>
</div>
</li>
<!-- PIN Protection -->
<li class="border-b border-white/20 py-stack-md flex flex-col sm:flex-row sm:justify-between sm:items-center group cursor-pointer transition-opacity duration-200 ease-in-out hover:opacity-70 gap-1">
<span class="font-body-lg text-body-lg text-primary">PIN Protection</span>
<span class="font-body-md text-body-md text-on-surface-variant">Disabled</span>
</li>
</ul>
<!-- Account Section Example -->
<h2 class="font-label-lg text-label-lg text-on-surface-variant mt-stack-lg mb-stack-md uppercase tracking-widest">Account</h2>
<ul class="flex flex-col w-full">
<li class="border-b border-white/20 py-stack-md flex justify-between items-center group cursor-pointer transition-opacity duration-200 ease-in-out hover:opacity-70">
<span class="font-body-lg text-body-lg text-primary">Sign Out</span>
</li>
<li class="py-stack-md flex justify-between items-center group cursor-pointer transition-opacity duration-200 ease-in-out hover:opacity-70">
<span class="font-body-lg text-body-lg text-error">Delete Account</span>
</li>
</ul>
