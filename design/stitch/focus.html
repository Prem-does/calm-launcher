 ["Inter"], display: ["Inter"], body: ["Inter"], label: ["Inter"]}, fontSize: {"body-md": ["16px", {lineHeight: "24px", fontWeight: "400"}], "headline-md": ["24px", {lineHeight: "32px", fontWeight: "500"}], "headline-lg": ["48px", {lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "500"}], "body-lg": ["18px", {lineHeight: "28px", fontWeight: "400"}], "label-lg": ["14px", {lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "600"}], "headline-lg-mobile": ["32px", {lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "500"}], "label-md": ["12px", {lineHeight: "16px", fontWeight: "400"}]}}}};</script>
<style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent scrolling in focus mode */
        }
        
        .progress-bar {
            width: 0%;
            height: 2px;
            background-color: #ffffff;
            transition: width 0.1s linear;
        }

        .focus-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: theme('spacing.margin-mobile');
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .focus-content.fade-out {
            opacity: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased selection:bg-white selection:text-black flex flex-col justify-between items-center h-screen w-full relative bg-black">
<!-- Dimmed Status Bar Area (Hidden on purpose, minimal top space) -->
<div class="w-full h-8 flex justify-end items-center px-4 opacity-20 pointer-events-none">
<span class="font-label-md text-label-md text-white">--:--</span>
</div>
<!-- Main Content Canvas -->
<main class="focus-content text-center max-w-md mx-auto z-10 relative w-full h-full flex items-center justify-center">
<!-- Ambient subtle background noise for e-ink feel -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<div class="px-6 relative z-10">
<h1 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg text-white tracking-tight leading-snug">
                "Presence is the greatest gift."
            </h1>
</div>
</main>
<!-- Bottom Interaction Area -->
<footer class="w-full pb-12 pt-8 flex flex-col items-center justify-center relative z-20">
<!-- Progress indicator for long press -->
<div class="w-24 h-[2px] bg-white mb-6 rounded-full overflow-hidden opacity-50 relative">
<div class="progress-bar absolute top-0 left-0 h-full" id="longPressProgress"></div>
</div>
<button aria-label="Hold to end focus mode" class="font-label-lg text-label-lg text-white transition-opacity duration-300 ease-in-out focus:outline-none uppercase tracking-widest opacity-60 hover:opacity-100 select-none touch-none" id="endFocusBtn">
            End Focus
        </button>
<span class="font-label-md text-label-md text-white mt-2 opacity-50">Hold to exit</span>
</footer>
<!-- Interactive Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('endFocusBtn');
            const progress = document.getElementById('longPressProgress');
            const content = document.querySelector('.focus-content');
            
            let pressTimer;
            let progressInterval;
            let currentWidth = 0;
            const PRESS_DURATION = 1500; // 1.5 seconds to exit
            const INTERVAL_SPEED = 20;
            const INCREMENT = (100 / (PRESS_DURATION / INTERVAL_SPEED));

            const startPress = (e) => {
                e.preventDefault(); // Prevent text selection/magnifier on mobile
                
                // Clear any existing timers
                clearInterval(progressInterval);
                clearTimeout(pressTimer);
                currentWidth = 0;
                
                // Visual feedback that press started
                btn.classList.add('opacity-100');
                btn.classList.remove('opacity-60');

                // Animate progress bar
                progressInterval = setInterval(() => {
                    currentWidth += INCREMENT;
                    progress.style.width = `${currentWidth}%`;
                    
                    if (currentWidth >= 100) {
                        clearInterval(progressInterval);
                    }
                }, INTERVAL_SPEED);

                // Setup the exit trigger
                pressTimer = setTimeout(() => {
                    executeExit();
                }, PRESS_DURATION);
            };

            const endPress = (e) => {
                e.preventDefault();
                // Reset everything if released early
                clearTimeout(pressTimer);
                clearInterval(progressInterval);
                
                progress.style.width = '0%';
                currentWidth = 0;
                
                // Restore visual state
                btn.classList.remove('opacity-100');
                btn.classList.add('opacity-60');
            };

            const executeExit = () => {
                // Visual feedback of exit
                content.classList.add('fade-out');
                btn.textContent = 'EXITING...';
                
                // Here you would typically route to the HOME destination
                // setTimeout(() => window.location.href = '/home', 600);
            };

            // Touch events for mobile
            btn.addEventListener('touchstart', startPress, { passive: false });
            btn.addEventListener('touchend', endPress);
            btn.addEventListener('touchcancel', endPress);

            // Mouse events for desktop testing
            btn.addEventListener('mousedown', startPress);
            btn.addEventListener('mouseup', endPress);
            btn.addEventListener('mouseleave', endPress);
            
            // Prevent context menu on long press
            btn.addEventListener('contextmenu', e => e.preventDefault());
        });
    </script>
</body></html>
